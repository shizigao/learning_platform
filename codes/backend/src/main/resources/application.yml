server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: learning-platform-backend
  profiles:
    active: ${APP_ENV:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:learning_platform}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      client-name: learning-platform-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    # Spring MVC 在 DEBUG/TRACE 下会调用请求和响应对象的 toString，
    # 登录、AI 提问等接口可能因此泄露密码、JWT 或用户正文。
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,minio

app:
  environment: ${APP_ENV:local}
  redis:
    distributed-guards-enabled: ${REDIS_DISTRIBUTED_GUARDS_ENABLED:true}
    auth-snapshot-enabled: ${REDIS_AUTH_SNAPSHOT_ENABLED:true}
    auth-snapshot-ttl: ${REDIS_AUTH_SNAPSHOT_TTL_SECONDS:60}s
    read-cache-enabled: ${REDIS_READ_CACHE_ENABLED:true}
    authorization-cache-enabled: ${REDIS_AUTHORIZATION_CACHE_ENABLED:true}
    authorization-cache-ttl: ${REDIS_AUTHORIZATION_CACHE_TTL_SECONDS:30}s
    content-view-buffer-enabled: ${REDIS_CONTENT_VIEW_BUFFER_ENABLED:true}
    content-view-flush-ms: ${REDIS_CONTENT_VIEW_FLUSH_MILLIS:30000}
    content-view-flush-initial-delay-ms: ${REDIS_CONTENT_VIEW_FLUSH_INITIAL_DELAY_MILLIS:30000}
  offline-teaching:
    security:
      encryption-key: ${TEACHER_DATA_ENCRYPTION_KEY:}
  exam:
    runtime-cache-enabled: ${EXAM_RUNTIME_CACHE_ENABLED:true}
    timeout-scan-ms: ${EXAM_TIMEOUT_SCAN_MS:5000}
    timeout-scan-initial-delay-ms: ${EXAM_TIMEOUT_SCAN_INITIAL_DELAY_MS:5000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:120}m
    login-protection:
      enabled: ${LOGIN_PROTECTION_ENABLED:true}
      max-account-failures: ${LOGIN_MAX_ACCOUNT_FAILURES:5}
      max-ip-failures: ${LOGIN_MAX_IP_FAILURES:20}
      window: ${LOGIN_PROTECTION_WINDOW_MINUTES:15}m
    rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
      general-requests-per-minute: ${API_GENERAL_REQUESTS_PER_MINUTE:600}
      auth-requests-per-minute: ${API_AUTH_REQUESTS_PER_MINUTE:30}
      upload-requests-per-minute: ${API_UPLOAD_REQUESTS_PER_MINUTE:30}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:learning-platform}
  upload:
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
    max-files-per-content: ${UPLOAD_MAX_FILES_PER_CONTENT:20}
    signed-url-ttl: ${UPLOAD_SIGNED_URL_TTL_MINUTES:10}m
  ai:
    provider: ${AI_PROVIDER:mock}
    limits:
      max-input-chars: ${AI_MAX_INPUT_CHARS:100000}
      max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:10}
      max-context-chars: ${AI_MAX_CONTEXT_CHARS:20000}
      requests-per-window: ${AI_REQUESTS_PER_WINDOW:10}
      rate-window: ${AI_RATE_WINDOW_SECONDS:60}s
      max-concurrent-per-user: ${AI_MAX_CONCURRENT_PER_USER:1}
      timeout: ${AI_REQUEST_TIMEOUT_SECONDS:630}s
    mock:
      model: ${AI_MOCK_MODEL:mock-learning-assistant-v1}
      scenario: ${AI_MOCK_SCENARIO:success}
      delay: ${AI_MOCK_DELAY_MILLIS:0}ms
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}s
      timeout: ${DEEPSEEK_TIMEOUT_SECONDS:620}s
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:false}
